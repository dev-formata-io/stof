# AUTO-GENERATED WITH STOF.
# RUN "stof run project.stof" TO REGENERATE.
[package]
name = "stof"
version = "0.10.3"
authors = ["CJ Cummings <cj@formata.io>"]
description = "Portable, sandboxed logic inside data: JSON with functions you can send anywhere and run safely in Rust, WebAssembly, and Python."
license = "Apache-2.0"
repository = "https://github.com/dev-formata-io/stof"
homepage = "https://stof.dev"
keywords = ["sandbox", "scripting", "json", "wasm", "rules-engine"]
categories = ["wasm", "encoding", "config", "development-tools", "compilers"]
exclude = ["content/*", "web/*", "docs/*", "stof/*", ".github/*", ".vscode/*", "*.gif", "*.png"]
edition = "2024"

[lib]
crate-type = ["cdylib", "lib"]
bench = false
doctest = false

[features]
default = ["basic"]
basic = ["stof_std", "system", "pkg", "log", "stacker"]
full = ["stof_std", "system", "pkg", "log", "stacker", "image", "docx", "pdf", "http", "tokio", "age_encrypt"]
stof_std = ["dep:regex"]
system = []
pkg = ["dep:zip", "dep:regex", "dep:walkdir"]
log = ["dep:log"]
stacker = ["dep:stacker"]
image = ["dep:image"]
docx = ["dep:docx-rs"]
pdf = ["dep:lopdf", "image"]
http = ["dep:reqwest"]
tokio = ["dep:tokio"]
age_encrypt = ["dep:age"]
py = ["full", "dep:pyo3"]
js = ["stof_std", "age_encrypt", "dep:js-sys", "dep:wasm-bindgen", "dep:serde-wasm-bindgen", "dep:getrandom", "dep:wasm-bindgen-futures", "dep:web-sys", "dep:console_error_panic_hook"]

[profile.release]
lto = "fat"
codegen-units = 1

[dependencies]
base64 = "0.22.1"
bincode = "1.3.3"
colored = "3.1.1"
lazy_static = "1.5.0"
nanoid = "0.4.0"
serde_yaml = "0.9.34"
typetag = "0.2.23"
urlencoding = "2.1.3"
chrono = "0.4.45"
rustc-hash = "2.1.3"
nom = "8.0.0"

[dependencies.indexmap]
version = "2.14.2"
features = ["serde"]

[dependencies.bytes]
version = "1.12.1"
features = ["serde"]

[dependencies.docx-rs]
version = "0.4.22"
optional = true

[dependencies.image]
version = "0.25.10"
features = ["serde"]
optional = true

[dependencies.markdown]
version = "1.0.0"
features = ["serde"]

[dependencies.compact_str]
version = "0.9.1"
features = ["serde"]

[dependencies.lopdf]
version = "0.45.0"
features = ["serde"]
optional = true

[dependencies.regex]
version = "1.13.1"
optional = true

[dependencies.serde]
version = "1.0.229"
features = ["derive", "rc"]

[dependencies.serde_json]
version = "1.0.151"
features = ["preserve_order"]

[dependencies.toml]
version = "0.9.12"
features = ["preserve_order"]

[dependencies.walkdir]
version = "2.5.0"
optional = true

[dependencies.zip]
version = "4.6.1"
optional = true

[dependencies.tokio]
version = "1.53.1"
features = ["full"]
optional = true

[dependencies.reqwest]
version = "0.12.28"
optional = true
features = ["blocking"]

[dependencies.imbl]
version = "7.0.2"
features = ["serde", "triomphe"]

[dependencies.arcstr]
version = "1.2.0"
features = ["serde"]

[dependencies.parking_lot]
version = "0.12.5"
features = ["serde"]

[dependencies.age]
version = "0.11.5"
optional = true
features = ["web-sys"]

[dependencies.log]
version = "0.4.34"
optional = true

[dependencies.stacker]
version = "0.1.25"
optional = true

[dependencies.web-time]
version = "1.1.0"
features = ["serde"]

[dependencies.pyo3]
version = "0.29.3"
optional = true
features = ["macros", "chrono", "chrono-tz", "hashbrown", "indexmap", "generate-import-lib", "extension-module"]

[dependencies.wasm-bindgen]
version = "0.2.129"
optional = true

[dependencies.wasm-bindgen-futures]
version = "0.4.79"
optional = true

[dependencies.serde-wasm-bindgen]
version = "0.6.5"
optional = true

[dependencies.js-sys]
version = "0.3.106"
optional = true

[dependencies.getrandom]
version = "0.2.17"
optional = true
features = ["js"]

[dependencies.web-sys]
version = "0.3.106"
optional = true
features = ["console", "Window"]

[dependencies.console_error_panic_hook]
version = "0.1.7"
optional = true
