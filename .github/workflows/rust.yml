name: Rust
on:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main
env:
  CARGO_TERM_COLOR: always
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose
    - name: Run tests (all features)
      run: cargo test --verbose --features full
    - name: Check the JavaScript build
      run: cargo check --verbose --features js
  javascript:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Build the engine
      run: rustup target add wasm32-unknown-unknown && cargo install wasm-bindgen-cli --locked --version 0.2.129 && cargo build --release --target wasm32-unknown-unknown --no-default-features --features js && wasm-bindgen --target web --out-dir web/pkg --out-name stof target/wasm32-unknown-unknown/release/stof.wasm
    - name: Build the package
      run: npm ci && npm run build
      working-directory: web
    - name: Check the JavaScript build
      run: node tests/js/check.mjs
  python:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Build the wheel
      run: pip install maturin && maturin build --release -o target/wheels && pip install target/wheels/*.whl
    - name: Check the Python build
      run: python tests/python/smoke.py
